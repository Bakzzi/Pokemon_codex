plugins { id 'com.android.application' }

dependencies { implementation 'androidx.javascriptengine:javascriptengine:1.1.1' }
dependencyLocking { lockAllConfigurations() }
def releaseInfo = new groovy.json.JsonSlurper().parse(file('../../version.json'))
def keyProps = new Properties()
def keyFile = file('../keystore.properties')
if (keyFile.exists()) keyFile.withInputStream { keyProps.load(it) }
android {
    namespace 'io.github.bakzzi.pokemonidle'
    compileSdk 36
    buildToolsVersion '36.1.0'
    defaultConfig {
        applicationId releaseInfo['package']
        minSdk 31
        targetSdk 36
        versionCode ((project.findProperty('apkVersionCode') ?: releaseInfo.code).toInteger())
        versionName (project.findProperty('apkVersionName') ?: releaseInfo.name)
        testInstrumentationRunner 'io.github.bakzzi.pokemonidle.MobileTest'
    }
    signingConfigs {
        release {
            if (keyFile.exists()) {
                storeFile file(keyProps['storeFile'])
                storePassword keyProps['storePassword']
                keyAlias keyProps['keyAlias']
                keyPassword keyProps['keyPassword']
            }
        }
    }
    buildTypes {
        release { signingConfig signingConfigs.release; minifyEnabled false }
        debug { applicationIdSuffix '.test'; debuggable true }
    }
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/gameAssets')
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/notification/assets')
    sourceSets.main.res.srcDir layout.buildDirectory.dir('generated/notification/res')
    sourceSets.main.java.srcDir layout.buildDirectory.dir('generated/notification/java')
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { abortOnError true; checkReleaseBuilds true }
    testBuildType 'release'
    sourceSets.androidTest.assets.srcDir layout.buildDirectory.dir('generated/testAssets')
}
tasks.register('bundleGame', Exec) {
    workingDir file('../../..')
    commandLine 'node', 'mobile/scripts/build-web.cjs'
    inputs.files(fileTree('../../../desktop') { exclude '.smoke/**', '.demo/**', 'test/**' }, fileTree('../../../shared'), fileTree('../../web'), file('../../adventure.cjs'), file('../../rivals.cjs'), file('../../rescue.cjs'), file('../../silph.cjs'), file('../../safari.cjs'), file('../../mansion.cjs'), fileTree('../../assets'), file('../../version.json'), file('../../scripts/build-web.cjs'), file('../../../package-lock.json'))
    outputs.dir layout.buildDirectory.dir('generated/gameAssets')
}
tasks.register('bundleNotification', Exec) {
    workingDir file('../../..')
    commandLine 'node', 'mobile/scripts/build-notification.cjs'
    inputs.files(file('../../../desktop/data/game-data.json'), fileTree('../../../desktop/assets') { include '*.gif', 'shiny/*.gif' }, file('../../scripts/build-notification.cjs'))
    outputs.dir layout.buildDirectory.dir('generated/notification')
}

tasks.named('preBuild').configure { dependsOn 'bundleGame', 'bundleNotification' }
