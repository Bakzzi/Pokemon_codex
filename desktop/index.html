<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; font-src 'self'">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Agent 포켓몬 키우기</title><link rel="stylesheet" href="widget.css"><link rel="stylesheet" href="battle-ui.css"><link rel="stylesheet" href="story.css"><link rel="stylesheet" href="safari-scene.css">
</head><body>
<main class="widget">
  <header class="toolbar">
    <div class="brand"><span class="pokeball"></span>POKÉMON <span>/</span> <b id="agent-label">AI AGENT</b></div>
    <div class="toolbar-right"><div class="connection"><i></i><span id="connection-label">연결 준비 중</span></div><nav aria-label="위젯 조작">
      <button id="pin" title="항상 위에" aria-label="항상 위에" aria-pressed="true">⌖</button>
      <button id="compact" title="작게 보기" aria-label="작게 보기">▱</button>
      <button id="hide" title="트레이로 숨기기" aria-label="트레이로 숨기기">−</button>
      <button id="close" title="종료" aria-label="종료">×</button>
    </nav></div>
  </header>
  <section class="scene" aria-label="포켓몬 배틀">
    <section id="story-scene" aria-label="트레이너 대화" hidden><div id="story-stage"><img id="story-portrait" alt=""><img id="story-hero" alt=""><img id="story-foe" alt=""><img id="story-hero-ball" src="assets/items/poke-ball.png" alt=""><img id="story-foe-ball" src="assets/items/poke-ball.png" alt=""></div><button id="story-next"><b id="story-name"></b><span id="story-text" aria-live="polite"></span><small id="story-hint"></small></button></section>
    <div class="speech" id="speech" data-speaker="scene" role="status"><img id="speech-item" alt="" hidden><span id="speech-text">오늘도 함께 모험하자!</span><span class="pokeball waiting-ball" aria-hidden="true"></span></div>
    <section id="safari-scene" aria-label="사파리 탐험" hidden><b id="safari-title">SAFARI ZONE</b><div class="safari-ground"></div><div id="safari-red" role="img" aria-label="사파리를 걷는 레드"></div><span id="safari-name">레드</span><div id="safari-grass" aria-hidden="true"><i></i><i></i><i></i></div><span id="safari-text" role="status">풀숲을 살펴보는 중</span><img id="safari-ball" src="assets/items/poke-ball.png" alt="몬스터볼" hidden><span id="safari-sparkle" aria-hidden="true" hidden>✦</span><div class="safari-footer"><div><i id="safari-progress"></i></div><span id="safari-supplies"></span></div></section>
    <div class="ground hero-ground"></div><div class="ground foe-ground" id="foe-ground"></div>
    <div class="hero sprite" id="hero"><img id="hero-image" src="assets/25.gif" alt="피카츄" draggable="false"></div>
    <div class="foe sprite" id="foe"><img id="foe-image" src="assets/19.gif" alt="" draggable="false"></div>
    <div id="hero-hud" class="battle-hud hero-hud"><div class="battle-name"><b id="hero-battle-name">피카츄</b><span id="hero-battle-level">L5</span></div><div class="hp-row"><b id="hero-hp-label">HP</b><div class="health"><i id="hero-hp"></i></div></div><div id="hero-hp-number" class="hp-number"></div></div>
    <div id="foe-hud" class="battle-hud foe-hud"><div class="battle-name"><b id="foe-name"></b><span id="foe-battle-level"></span></div><div class="hp-row"><b id="foe-hp-label">HP</b><div class="health"><i id="foe-hp"></i></div></div><div id="foe-hp-number" class="hp-number"></div></div>
    <canvas id="attack-fx" width="185" height="79" aria-hidden="true" hidden></canvas><div id="switch-flash" aria-hidden="true" hidden></div><div id="switch-beam" aria-hidden="true" hidden></div><div id="ball-fx" class="pokeball" aria-hidden="true"></div>
    <div id="capture-fx" aria-hidden="true" hidden><div id="capture-ball" class="pokeball"></div><div id="capture-flash"></div><div id="capture-sparkles"><i>✦</i><i>✦</i><i>✦</i><i>✦</i></div></div>
    <div id="empty-foe">다음 만남을 기다리는 중</div>
  </section>
  <section class="card">
    <div class="identity"><div><span class="eyebrow" id="region">KANTO ADVENTURE</span><h1 id="hero-name">피카츄</h1></div><div class="level"><small>LV.</small><strong id="level">5</strong></div></div>
    <div class="status-line"><span id="status">코딩하며 모험을 이어가요</span><span id="mode-tag">LIVE</span></div>
    <div class="xp-heading"><span>EXP <b id="exp"></b> <b id="xp-boost" class="xp-boost"></b></span><span id="evolution"></span></div>
    <div class="xp-track"><i id="xp-bar"></i></div>
    <div class="limits">
      <div><span id="limit-a-label">5시간 남음</span><b id="limit-a-value">—</b><div class="limit-track"><i id="limit-a-bar"></i></div></div>
      <div><span id="limit-b-label">주간 남음</span><b id="limit-b-value">—</b><div class="limit-track"><i id="limit-b-bar"></i></div></div>
    </div>
    <div class="party" id="party" aria-label="출전 포켓몬 선택"></div>
  </section>
  <div class="menu">
    <button data-panel="collection">포켓기어</button>
    <button data-panel="challenge">타운맵</button>
    <button data-panel="daycare">가방보기</button>
    <button data-panel="journal">모험 기록</button>
  </div>
</main><script src="capture-animation.js"></script><script src="move-effects.js"></script><script src="battle-pacing.js"></script><script src="agent-status.js"></script><script src="story-presentation.js"></script><script src="safari-presentation.js"></script><script src="renderer.js"></script></body></html>
